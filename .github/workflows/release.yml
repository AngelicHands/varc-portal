name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast gate: version alignment + lint + Go tests. Everything else waits on this.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      web: ${{ steps.image.outputs.web }}
      api: ${{ steps.image.outputs.api }}
      hls_poster: ${{ steps.image.outputs.hls_poster }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag version: ${{ steps.version.outputs.version }}"
          echo "VERSION file: ${FILE_VERSION}"
          echo "package.json: ${PKG_VERSION}"

          if [[ "${FILE_VERSION}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::VERSION (${FILE_VERSION}) does not match tag ${{ steps.version.outputs.tag }}"
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match tag ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Set image names
        id: image
        run: |
          OWNER_REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "web=ghcr.io/${OWNER_REPO}" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${OWNER_REPO}-api" >> "$GITHUB_OUTPUT"
          echo "hls_poster=ghcr.io/${OWNER_REPO}-hls-poster" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum

      - name: Test API
        run: go test ./...
        working-directory: apps/api

  # Host standalone tarball (independent of Docker image builds).
  package:
    name: Package standalone
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          MONGODB_URI: mongodb://localhost:27017/varc
          NEXTAUTH_URL: http://localhost:3099
          AUTH_URL: http://localhost:3099
          NEXTAUTH_SECRET: ci-build-secret-not-for-production
          AUTH_SECRET: ci-build-secret-not-for-production
          NEXT_PUBLIC_SITE_URL: http://localhost:3099

      - name: Package standalone build
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          mkdir -p dist
          cp -R .next/standalone dist/varc-portal
          mkdir -p dist/varc-portal/.next
          cp -R .next/static dist/varc-portal/.next/static
          if [[ -d public ]]; then
            cp -R public dist/varc-portal/public
          fi
          tar -czf "dist/varc-portal-${VERSION}-standalone.tar.gz" -C dist varc-portal

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-tarball
          path: dist/varc-portal-${{ needs.verify.outputs.version }}-standalone.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Three GHCR images in parallel (each builds in its own Dockerfile/stage).
  docker:
    name: Docker (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            context: .
            target: web-runner
            image: ${{ needs.verify.outputs.web }}
            cache_scope: web-image
          - name: hls-poster
            context: .
            target: hls-poster-worker
            image: ${{ needs.verify.outputs.hls_poster }}
            cache_scope: hls-poster-image
          - name: api
            context: apps/api
            image: ${{ needs.verify.outputs.api }}
            cache_scope: api-image
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.verify.outputs.tag }}
            ${{ matrix.image }}:${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  release:
    name: GitHub Release
    needs: [verify, package, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: standalone-tarball
          path: dist

      - name: Resolve previous release tag
        id: prev
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          PREV="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${TAG}^" 2>/dev/null || true)"
          if [[ -z "${PREV}" ]]; then
            PREV="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vxF "${TAG}" | head -n1 || true)"
          fi
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-<none>}"

      - name: Build release notes
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          PREV="${{ steps.prev.outputs.tag }}"

          list_commits() {
            local range="$1"
            # Exclude conventional "chore" commits (chore:, chore(...):, Chore:, etc.)
            git log --pretty=format:'- %s (%h) — %an' "${range}" \
              | grep -viE '^-[[:space:]]*chore(\([^)]*\))?[[:space:]]*:' \
              || true
          }

          {
            echo "## Commits"
            echo
            if [[ -n "${PREV}" ]]; then
              echo "Changes since \`${PREV}\`:"
              echo
              list_commits "${PREV}..${TAG}"
              echo
              echo
              echo "Compare: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            else
              echo "Initial release. Commit history:"
              echo
              list_commits "${TAG}"
              echo
            fi
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        if: ${{ steps.prev.outputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: VARC Portal ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          previous_tag: ${{ steps.prev.outputs.tag }}
          files: |
            dist/varc-portal-${{ needs.verify.outputs.version }}-standalone.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (first release)
        if: ${{ steps.prev.outputs.tag == '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: VARC Portal ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/varc-portal-${{ needs.verify.outputs.version }}-standalone.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
