name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to deploy (e.g. 0.0.2 or v0.0.2)"
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: deploy-varc-portal
  cancel-in-progress: false

jobs:
  deploy:
    name: Pin image tag for Argo CD
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Normalize version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: ${{ inputs.version }}"
            exit 1
          fi
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"

      - name: Set image names
        id: image
        run: |
          OWNER_REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "web=ghcr.io/${OWNER_REPO}" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${OWNER_REPO}-backup-worker" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}"

      - name: Verify GHCR image tags exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          check_image() {
            local image="$1"
            local pkg owner
            pkg="$(basename "${image}")"
            owner="$(dirname "${image#ghcr.io/}")"
            echo "Checking package ${owner}/${pkg} tag ${TAG}"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${owner}/packages/container/${pkg}/versions" \
              --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" \
              | grep -q . \
              || gh api \
                -H "Accept: application/vnd.github+json" \
                "/users/${owner}/packages/container/${pkg}/versions" \
                --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" \
                | grep -q .
          }

          check_image "${{ steps.image.outputs.web }}"
          check_image "${{ steps.image.outputs.worker }}"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Update deployment images
        run: |
          update_file() {
            local file="$1"
            local image="$2"
            if [[ ! -f "${file}" ]]; then
              echo "Skipping ${file} (not found)"
              return
            fi
            if ! grep -q 'image: ' "${file}"; then
              echo "::error::No image field in ${file}"
              exit 1
            fi
            sed -i.bak -E "s|image:[[:space:]]*.*$|image: ${image}|" "${file}"
            rm -f "${file}.bak"
            echo "Updated ${file} to ${image}"
            grep -n 'image:' "${file}"
          }

          FILE="deploy/k8s/deployment.yaml"
          update_file "${FILE}" "${{ steps.image.outputs.web }}:${{ steps.version.outputs.tag }}"

          FILE="deploy/k8s/backup-worker.yaml"
          update_file "${FILE}" "${{ steps.image.outputs.worker }}:${{ steps.version.outputs.tag }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml deploy/k8s/backup-worker.yaml
          if git diff --staged --quiet; then
            echo "Images already set to ${{ steps.version.outputs.tag }}; nothing to commit."
            exit 0
          fi
          git commit -m "chore: deploy ${{ steps.version.outputs.tag }}"
          git push origin HEAD
