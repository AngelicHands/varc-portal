apiVersion: v1
kind: ConfigMap
metadata:
  name: varc-portal-config
  namespace: varc
data:
  PORT: "3099"
  NEXTAUTH_URL: "https://hamvn.com"
  NEXT_PUBLIC_SITE_URL: "https://hamvn.com"
  AUTH_URL: "https://hamvn.com"
  AUTH_TRUST_HOST: "true"
  # Redis-compatible Valkey host (auth via VALKEY_PASSWORD in the Secret).
  VALKEY_URL: "redis://valkey:6379"
  STORAGE_DRIVER: "s3"
  S3_ENDPOINT: "https://s3.classq.io"
  S3_REGION: "us-east-1"
  S3_BUCKET: "varc-portal-media"
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_URL: "https://s3.classq.io/varc-portal-media"
  # MinIO/S3-compatible: AWS SDK v2 default CRC32 trailers break PutObject >16MiB.
  AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
  AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
  # Media library limits (50MB). Override MIME list only if you need a tighter allow-list.
  MEDIA_MAX_BYTES: "52428800"
  MEDIA_ALLOWED_MIME: "image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime,application/pdf,text/plain,application/zip,application/x-zip-compressed,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation"
  # Cloudflare mail rate limits (optional; requires Valkey)
  CF_MAIL_MAX: "500"
  CF_MAIL_RATE_LIMIT: "5"
  CF_MAIL_RATE_LIMIT_WINDOW: "1h"
  # Email and backup queues are processed by deploy/k8s/worker.yaml (Go varc-worker).
  # Keep disabled on the web pod — Next standalone does not reliably run instrumentation.ts.
  EMAIL_WORKER_ENABLED: "0"
  EMAIL_WORKER_POLL_MS: "3000"
  # QSO logbook: max confirmation emails per non-admin user (admins bypass)
  QSO_EMAIL_LIMIT: "20"
  BACKUP_S3_PREFIX: "backup-artifacts"
  BACKUP_MAX_AGE_DAYS: "7"
  BACKUP_MAX_COUNT: "10"
  BACKUP_WORKER_POLL_MS: "5000"
  IMPORT_EXPORT_WORKER_POLL_MS: "30000"
  # HLS poster backfill is a separate Node worker (pnpm worker:hls-poster).
  # Requires ffmpeg. Keep disabled on the Go worker pod.
  HLS_POSTER_WORKER_ENABLED: "0"
  HLS_POSTER_WORKER_POLL_MS: "300"
  HLS_POSTER_WORKER_BATCH: "2"
  HLS_POSTER_SEEK_SECONDS: "1"
  # Cluster DNS service port is 80 (targetPort 3099 on the portal pod).
  PORTAL_INTERNAL_URL: "http://varc-portal"
  BACKUP_RESTORE_UPLOAD_MAX_BYTES: "536870912"
  API_PORT: "3100"
  API_PUBLIC_URL: "https://api.hamvn.com"
  API_RATE_LIMIT: "120"
  API_RATE_LIMIT_WINDOW: "1m"
  API_RATE_LIMIT_WRITE: "30"
  API_AUTH_CACHE_TTL: "90s"
  API_AUTH_CACHE_FLUSH_ON_START: "true"
  API_DEV_ACCESS_LOG: "false"
