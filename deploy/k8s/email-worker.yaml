apiVersion: apps/v1
kind: Deployment
metadata:
  name: varc-portal-email-worker
  namespace: varc
  labels:
    app: varc-portal-email-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: varc-portal-email-worker
  template:
    metadata:
      labels:
        app: varc-portal-email-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          # Reuses the backup-worker image (contains run-email-worker.js).
          # Deploy workflow pins this tag together with backup-worker.yaml.
          image: ghcr.io/varc-vietnam/varc-portal-backup-worker:v1.0.16
          imagePullPolicy: Always
          command: ["node", "dist/worker/run-email-worker.js"]
          envFrom:
            - secretRef:
                name: varc-portal-secrets
            - configMapRef:
                name: varc-portal-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
