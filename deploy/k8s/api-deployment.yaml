apiVersion: apps/v1
kind: Deployment
metadata:
  name: varc-api
  namespace: varc
  labels:
    app: varc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: varc-api
  template:
    metadata:
      labels:
        app: varc-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          # Pin tag via .github/workflows/deploy.yml (on-demand deploy).
          image: ghcr.io/varc-vietnam/varc-portal-api:v1.0.39
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3100
          envFrom:
            - secretRef:
                name: varc-portal-secrets
            - configMapRef:
                name: varc-portal-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
