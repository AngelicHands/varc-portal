apiVersion: apps/v1
kind: Deployment
metadata:
  name: varc-api
  namespace: varc
  labels:
    app: varc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: varc-api
  template:
    metadata:
      labels:
        app: varc-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/varc-vietnam/varc-portal-api:v1.0.16
          imagePullPolicy: Always
          ports:
            - containerPort: 3100
          envFrom:
            - secretRef:
                name: varc-portal-secrets
            - configMapRef:
                name: varc-portal-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
