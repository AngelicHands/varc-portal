# Not synced by Argo. Copy, edit, apply — do not commit real values.
#   kubectl apply -f /tmp/varc-secrets.yaml
#
# GHCR pull secret (do not hand-write .dockerconfigjson auth — it must be real base64):
#   kubectl create secret docker-registry ghcr-pull \
#     -n varc \
#     --docker-server=ghcr.io \
#     --docker-username=YOUR_GITHUB_USER \
#     --docker-password=YOUR_GITHUB_PAT \
#     --docker-email=you@example.com \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: varc-portal-secrets
  namespace: varc
type: Opaque
stringData:
  MONGODB_URI: "mongodb://USER:PASSWORD@mongo-host:27017/varc?authSource=admin"
  NEXTAUTH_SECRET: "replace-with-long-random-string"
  AUTH_SECRET: "replace-with-long-random-string"
  INITIAL_ADMIN_EMAIL: "admin@example.com"
  INITIAL_ADMIN_PASSWORD: "changeme"
  INITIAL_ADMIN_NAME: "VARC Admin"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  S3_ACCESS_KEY: "replace-me"
  S3_SECRET_KEY: "replace-me"
  VALKEY_PASSWORD: "replace-with-a-long-random-valkey-password"
  # Cloudflare Email Sending (REST API). FROM must be on an onboarded domain.
  # Required for form notifications and QSO confirmation emails.
  CF_MAIL_API_TOKEN: "replace-with-cloudflare-email-sending-api-token"
  CF_MAIL_ACCOUNT_ID: "replace-with-cloudflare-account-id"
  CF_MAIL_FROM: "noreply@yourdomain.com"
  # MapLibre basemap (MapTiler). Required for operator map view (?view=map).
  NEXT_PUBLIC_MAPTILER_API_KEY: "replace-with-maptiler-api-key"
  API_TOKEN_PEPPER: "replace-or-leave-empty-to-use-AUTH_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-varc-portal
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/VARC-Vietnam/varc-portal.git
  username: git
  password: "github_pat_REPLACE_ME"
